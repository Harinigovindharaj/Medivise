<!DOCTYPE html>
<html ng-app="MediViseApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediVise | Secure Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="med-bg" 
      ng-class="{
        'bg-patient': user.role === 'Patient',
        'bg-doctor': user.role === 'Doctor',
        'bg-pharmacist': user.role === 'Pharmacist',
        'bg-researcher': user.role === 'Researcher',
        'bg-admin': user.role === 'Admin'
      }" 
      ng-controller="LoginCtrl">

    <div class="overlay">
        <h1 class="logo">
            <span style="color: #4facfe;">✚</span> MediVise
        </h1>
        
        <div class="grid-wrapper" ng-hide="ui.roleSelected">
            <h3 class="instruction-text">Identify Your Role to Access Portal</h3>
            <div class="role-grid">
                <div class="role-card glass" ng-click="selectRole('Patient')">
                    <div class="icon">👤</div>
                    <span>Patient</span>
                </div>
                <div class="role-card glass" ng-click="selectRole('Doctor')">
                    <div class="icon">🩺</div>
                    <span>Doctor</span>
                </div>
                <div class="role-card glass" ng-click="selectRole('Pharmacist')">
                    <div class="icon">💊</div>
                    <span>Pharmacist</span>
                </div>
                <div class="role-card glass" ng-click="selectRole('Admin')">
                    <div class="icon">⚙️</div>
                    <span>Admin</span>
                </div>
                <div class="role-card glass" ng-click="selectRole('Researcher')">
                    <div class="icon">🔬</div>
                    <span>Researcher</span>
                </div>
            </div>
        </div>

        <div class="login-panel glass" ng-show="ui.roleSelected">
            <button class="back-btn" ng-click="resetView()">← Change Role</button>
            
            <h2 class="form-title">
                {{ui.isRegistering ? user.role + ' Registration' : user.role + ' Authentication'}}
            </h2>

            <div ng-if="!ui.isRegistering">
                <form name="loginForm" novalidate>
                    <div class="input-box">
                        <input type="email" name="uEmail" placeholder="Email Address" ng-model="user.email" required>
                    </div>
                    <div class="input-box">
                        <input type="password" name="uPwd" placeholder="Password" ng-model="user.password" ng-minlength="8" required>
                    </div>
                    <div class="otp-container" ng-show="ui.otpSent">
                        <input type="text" name="uOtp" placeholder="6-Digit OTP" ng-model="user.otp" ng-pattern="/^\d{6}$/">
                    </div>

                    <div class="action-area">
                        <button type="button" class="btn-main" ng-hide="ui.otpSent" ng-click="handleSendOTP()">Send OTP</button>
                        <button type="button" class="btn-main success" ng-show="ui.otpSent" ng-click="handleLogin()">Verify & Login</button>
                    </div>
                </form>
                <p class="toggle-text" style="margin-top:15px; color:white; font-size:0.9rem; cursor:pointer;">
                    New User? <span ng-click="ui.isRegistering = true" style="color:#4facfe; text-decoration:underline;">Create Account</span>
                </p>
            </div>

            <div ng-if="ui.isRegistering" ng-controller="RegisterCtrl">
                <form name="regForm" novalidate>
                    <div class="input-box">
                        <input type="text" placeholder="Full Name" ng-model="userSignup.fullName" required style="margin-bottom:10px; width:100%; padding:10px; border-radius:8px; border:none;">
                    </div>
                    <div class="input-box">
                        <input type="email" placeholder="Email Address" ng-model="userSignup.email" required style="margin-bottom:10px; width:100%; padding:10px; border-radius:8px; border:none;">
                    </div>
                    <div class="input-box">
                        <input type="password" placeholder="Create Password (Min 8)" ng-model="userSignup.password" ng-minlength="8" required style="margin-bottom:10px; width:100%; padding:10px; border-radius:8px; border:none;">
                    </div>
                    <div class="input-box">
                        <input type="password" placeholder="Confirm Password" ng-model="userSignup.confirmPassword" required style="margin-bottom:15px; width:100%; padding:10px; border-radius:8px; border:none;">
                    </div>

                    <button type="button" class="btn-main success" ng-click="handleSignup()">
                        Register as {{$parent.user.role}}
                    </button>
                    
                    <p class="toggle-text" style="margin-top:15px; color:white; font-size:0.9rem;">
                        Already have an account? 
                        <span ng-click="$parent.ui.isRegistering = false" style="color:#4facfe; cursor:pointer; text-decoration:underline;">
                            Login
                        </span>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script src="app/app.js"></script>
    <script src="app/login.ctrl.js"></script>
    <script src="app/register.ctrl.js"></script>
    <script src="app/dashboard.ctrl.js"></script>
    <script src="app/upload.ctrl.js"></script>
</body>
</html>
