<!DOCTYPE html>
<html lang="en" ng-app="historyApp">
<head>
    <meta charset="UTF-8">
    <title>MediVise | Clinical History Archive</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #4facfe; --bg: #0f172a; --glass: rgba(30, 41, 59, 0.85); --border: rgba(255, 255, 255, 0.1); }
        body { 
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9));
            color: white; padding: 40px; min-height: 100vh;
        }
        .history-grid { display: grid; grid-template-columns: 320px 1fr; gap: 25px; max-width: 1400px; margin: 0 auto; }
        .record-card { 
            background: var(--glass); border-radius: 20px; padding: 25px; 
            border: 1px solid var(--border); backdrop-filter: blur(15px); height: 75vh; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .scroll-area { overflow-y: auto; flex-grow: 1; padding-right: 10px; }

        .list-item { 
            padding: 15px; border-radius: 12px; margin-bottom: 10px;
            background: rgba(255,255,255,0.03); cursor: pointer;
        }
        .list-item.active { background: var(--primary); color: #0f172a; }

        .rx-card { 
            background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; 
            margin-bottom: 15px; border-left: 5px solid var(--primary);
        }

        .btn-nav { 
            background: var(--primary); color: #0f172a; padding: 10px 20px; 
            border-radius: 10px; text-decoration: none; font-weight: 700; 
        }
    </style>
</head>

<body ng-controller="HistoryCtrl">

<header style="display:flex; justify-content:space-between;">
    <h1>Clinical History</h1>
    <a href="doctor.html" class="btn-nav">← Back</a>
</header>

<div class="history-grid">

    <!-- PATIENT LIST -->
    <div class="record-card">
        <h3>Patients</h3>

        <input type="text" ng-model="query" placeholder="Search..." />

        <div class="scroll-area">
            <div class="list-item"
                 ng-repeat="p in patients | filter:query"
                 ng-click="loadPatientHistory(p)"
                 ng-class="{active: selectedPatient._id === p._id}">

                <div>{{p.email}}</div>
                <small>ID: {{p._id}}</small>
            </div>
        </div>
    </div>

    <!-- HISTORY -->
    <div class="record-card">

        <div ng-if="!selectedPatient">
            <h2>Select patient</h2>
        </div>

        <div ng-if="selectedPatient" class="scroll-area">

            <h2>{{selectedPatient.email}}</h2>

            <h3>Prescriptions</h3>

            <div class="rx-card"
                 ng-repeat="rx in filteredHistory">

                <strong>{{rx.drugs.join(', ')}}</strong>

                <div>Status: {{rx.status || 'pending'}}</div>

            </div>

            <div ng-if="filteredHistory.length == 0">
                No data
            </div>

        </div>
    </div>

</div>

<script>
const app = angular.module('historyApp', []);

app.controller('HistoryCtrl', function($scope, $http) {

    // INIT LOAD
    $scope.init = function() {

        // GET PATIENTS
        $http.get('http://localhost:5000/doctor/patients', {
            withCredentials: true
        }).then(res => {
            $scope.patients = res.data.data;
        });

        // GET ALL PRESCRIPTIONS
        $http.get('http://localhost:5000/doctor/all', {
            withCredentials: true
        }).then(res => {
            $scope.fullArchive = res.data.data;
        });
    };

    // FILTER HISTORY
    $scope.loadPatientHistory = function(patient) {
        $scope.selectedPatient = patient;

        $scope.filteredHistory = $scope.fullArchive.filter(function(item) {
            return item.userId === patient._id;
        });
    };

    $scope.init();
});
</script>

</body>
</html>
