<!DOCTYPE html>
<html lang="en" ng-app="alertApp">
<head>
    <meta charset="UTF-8">
    <title>MediVise | Emergency Alerts</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        :root { --critical: #ff4d4d; --bg: #0f172a; --glass: rgba(30, 41, 59, 0.9); --border: rgba(255, 255, 255, 0.1); }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; padding: 40px; background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('../assets/img/doctor-bg.png'); background-size: cover; }
        .alert-card { background: var(--glass); border-left: 5px solid var(--critical); border-radius: 12px; padding: 25px; margin-bottom: 20px; backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(255, 77, 77, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); } }
        .btn-back { background: transparent; border: 1px solid white; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; margin-bottom: 20px; }
        .emergency-badge { background: var(--critical); padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 0.7rem; }
    </style>
</head>
<body ng-controller="AlertCtrl">
    <a href="doctor.html" class="btn-back">← Back to Dashboard</a>
    <h1> Critical Emergency Center</h1>
    <p style="opacity: 0.6;">Real-time critical events requiring immediate intervention.</p>

    <div class="alert-card" ng-repeat="a in criticalCases">
        <div>
            <span class="emergency-badge">CODE RED</span>
            <h2 style="margin: 10px 0 5px 0;">{{a.patient}}</h2>
            <p style="margin: 0; color: var(--critical);">{{a.condition}} - {{a.vitals}}</p>
            <small style="opacity: 0.5;">Ward: {{a.ward}} | Time: {{a.timestamp}}</small>
        </div>
        <button style="background: white; border: none; padding: 15px 30px; border-radius: 8px; font-weight: bold; cursor: pointer;" ng-click="dispatch(a)">RESPOND NOW</button>
    </div>

   <script>
        const app = angular.module('alertApp', []);

        // Enables session-based authentication with your Express backend
        app.config(['$httpProvider', function($httpProvider) {
            $httpProvider.defaults.withCredentials = true;
        }]);

        app.controller('AlertCtrl', function($scope, $http) {
            $scope.criticalCases = [];

            // 1. FETCH ACTUAL CRITICAL CASES FROM BACKEND
            $scope.init = function() {
                $http.get('http://localhost:5000/api/doctor/all')
                    .then(function(response) {
                        if (response.data.success) {
                            // Filter all records to only show those marked as 'Critical'
                            // or those with a high risk score ( > 70)
                            $scope.criticalCases = response.data.data.filter(function(item) {
                                return item.status === 'Critical' || item.risk > 70;
                            }).map(function(item) {
                                // Mapping backend fields to your UI fields
                                return {
                                    patient: item.patientName || item.name,
                                    condition: item.risk > 85 ? 'Severe Risk' : 'High Risk',
                                    vitals: 'Risk Score: ' + item.risk + '%',
                                    ward: item.patientId || 'General',
                                    timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                                };
                            });
                        }
                    }, function(error) {
                        console.error("Critical Alert System Offline:", error);
                    });
            };

            // 2. DISPATCH LOGIC
            $scope.dispatch = function(a) {
                // In a real app, you could send a POST request to a 'notifications' table here
                alert("EMERGENCY RESPONSE INITIATED: Medical Team Dispatched to " + a.ward + " for " + a.patient);
            };

            // Run on load
            $scope.init();
        });
    </script>
</body>
</html>
