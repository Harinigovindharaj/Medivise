<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediVise | Critical Safety Alerts</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --danger: #ef4444; --warning: #f59e0b; --accent: #87d3f3;
            --glass: rgba(15, 23, 42, 0.95); --border: rgba(255, 255, 255, 0.1); 
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif; color: #f1f5f9;
            background: #0f172a; min-height: 100vh;
        }

        .nav-header {
            padding: 15px 40px; background: rgba(0,0,0,0.3);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }

        /* Alert Card Styling */
        .alert-card {
            background: var(--glass); border-radius: 20px; border: 1px solid var(--danger);
            padding: 30px; position: relative; overflow: hidden;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.1);
        }

        .alert-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .pulse-icon { 
            width: 12px; height: 12px; background: var(--danger); border-radius: 50%; 
            box-shadow: 0 0 10px var(--danger); animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .evidence-box {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            padding: 20px; border-radius: 12px; margin-top: 20px;
        }

        /* Backend Loading State */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--glass); display: flex; align-items: center; 
            justify-content: center; z-index: 10; display: none;
        }

        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn { 
            flex: 1; padding: 15px; border-radius: 8px; font-weight: 700; 
            cursor: pointer; border: none; transition: 0.3s; text-align: center; text-decoration: none;
        }
        .btn-resolve { background: var(--accent); color: #0f172a; }
        .btn-dashboard { background: transparent; border: 1px solid var(--border); color: white; }
    </style>
</head>
<body>

    <nav class="nav-header">
        <strong style="color: var(--danger);">CRITICAL SYSTEM ALERT</strong>
        <a href="pharmacist.html" class="btn" style="width:auto; padding: 8px 15px; font-size: 0.8rem;">BACK TO DASHBOARD</a>
    </nav>

    <div class="container">
        <div class="alert-card" id="alert-container">
            <div id="loading-overlay">Retrieving Clinical Data...</div>

            <div class="alert-header">
                <div class="pulse-icon"></div>
                <h2 style="margin: 0;">Unsafe Prescription Detected</h2>
            </div>

            <p style="opacity: 0.7;">The MediVise AI has intercepted a high-risk prescription for <strong id="patient-name">...</strong>.</p>

            <div class="evidence-box">
                <h4 style="margin-top: 0; color: var(--warning);">Issue: <span id="alert-type">Analyzing...</span></h4>
                <p id="alert-description" style="font-size: 0.9rem; line-height: 1.6;">
                    Connecting to clinical database to fetch contraindication details...
                </p>
            </div>

            <div class="btn-group">
                <a href="pharmacist.html" class="btn btn-dashboard">IGNORE & EXIT</a>
                <button id="btn-resolve" class="btn btn-resolve">OPEN FOR REVIEW →</button>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // 1. BACKEND CONNECTION (SIMULATED AJAX)
            // In a real app, you would use: $.get('/api/alerts/current')
            function fetchAlertData() {
                $('#loading-overlay').fadeIn(200);

                setTimeout(function() {
                    const mockData = {
                        patient: "Sarah Jenkins",
                        type: "Lethal Contraindication",
                        description: "Patient is prescribed Warfarin. AI detected a new order for High-Dose Aspirin. This combination creates a 95% increase in hemorrhage risk for this patient's age group.",
                        targetPage: "pharmacist_verify.html"
                    };

                    // Using jQuery to inject data into DOM
                    $('#patient-name').text(mockData.patient);
                    $('#alert-type').text(mockData.type);
                    $('#alert-description').html(mockData.description);
                    $('#loading-overlay').fadeOut(300);
                }, 1200);
            }

            // Execute on load
            fetchAlertData();

            // 2. INTERNAL NAVIGATION VIA JQUERY
            $('#btn-resolve').on('click', function() {
                $(this).text("Redirecting...");
                // Direct to the verification step
                window.location.href = "pharmacist_verify.html";
            });

            // 3. EXTERNAL NAVIGATION (Back to Dashboard)
            $('.btn-dashboard').on('click', function(e) {
                if(!confirm("Are you sure you want to ignore this high-risk alert?")) {
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
