<!DOCTYPE html>
<html lang="en" ng-app="interactionApp">
<head>
    <meta charset="UTF-8">
    <title>MediVise | Interaction Analysis</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #38bdf8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --glass: rgba(15, 23, 42, 0.92);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif; color: #f1f5f9;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                        url('../assets/img/doctor-bg.png') no-repeat center center fixed;
            background-size: cover; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { width: 95%; max-width: 1000px; margin-top: 50px; padding-bottom: 50px; }

        .analysis-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 50px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            position: relative; overflow: hidden;
        }

        .scanner-line {
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            box-shadow: 0 0 20px var(--accent);
            position: absolute; left: 0; top: 0;
            animation: scanMove 3s infinite linear;
        }

        @keyframes scanMove {
            0% { top: 0; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .med-pill {
            display: inline-flex; align-items: center;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 50px;
            margin: 8px; font-weight: 500; color: var(--accent);
        }

        .interaction-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 15px; border: 1px solid transparent;
        }

        .severity-high { background: rgba(239, 68, 68, 0.15); color: var(--danger); padding: 5px 12px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; }
        .severity-mod { background: rgba(245, 158, 11, 0.15); color: var(--warning); padding: 5px 12px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; }

        .nav-footer {
            margin-top: 30px; display: flex; justify-content: space-between; width: 100%;
        }

        .btn {
            padding: 14px 32px; border-radius: 10px; cursor: pointer;
            font-weight: 600; text-decoration: none; border: none;
        }

        .btn-back { background: rgba(255,255,255,0.05); color: white; }
        .btn-next { background: var(--accent); color: #0f172a; }

        .loading-text { font-weight: 300; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
    </style>
</head>

<body ng-controller="InteractionCtrl">

<div class="container">
    <div class="analysis-card">
        <div class="scanner-line" ng-if="loading"></div>
        
        <h1>Interaction Analysis</h1>

        <div>
            <div class="med-pill" ng-repeat="m in medList">
                {{m}}
            </div>
        </div>

        <div ng-if="loading">
            <div class="loading-text">Analyzing...</div>
        </div>

        <div ng-if="!loading">
            <div class="interaction-item" ng-repeat="item in interactions">
                <div>
                    <div>{{item.pair}}</div>
                    <div>{{item.desc}}</div>
                </div>
                <div>
                    <span ng-class="item.severity === 'High' ? 'severity-high' : 'severity-mod'">
                        {{item.severity}}
                    </span>
                </div>
            </div>

            <div ng-if="interactions.length == 0">
                ✅ No interactions found
            </div>
        </div>
    </div>

    <div class="nav-footer">
        <a href="doctor_prescription.html" class="btn btn-back">← Back</a>
        <button class="btn btn-next" ng-click="proceed()">Next</button>
    </div>
</div>

<script>
const app = angular.module('interactionApp', []);

app.controller('InteractionCtrl', function($scope, $http, $timeout) {

    $scope.loading = true;
    $scope.medList = [];

    // 🔥 FETCH FROM BACKEND
    $http.get('http://localhost:5000/doctor/prescriptions', {
        withCredentials: true
    }).then(res => {

        const prescriptions = res.data.data;

        if (prescriptions.length > 0) {
            const latest = prescriptions[prescriptions.length - 1];
            $scope.medList = latest.drugs;
        }

        $timeout(() => {
            $scope.loading = false;
            $scope.runClinicalCheck();
        }, 2000);

    });

    $scope.runClinicalCheck = function() {
        const names = $scope.medList.map(m => m.toLowerCase());
        $scope.interactions = [];

        if(names.includes('aspirin') && names.includes('warfarin')) {
            $scope.interactions.push({
                pair: "Aspirin + Warfarin",
                severity: "High",
                desc: "High bleeding risk"
            });
        }

        if(names.includes('metformin') && names.includes('alcohol')) {
            $scope.interactions.push({
                pair: "Metformin + Alcohol",
                severity: "Moderate",
                desc: "Lactic acidosis risk"
            });
        }
    };

    $scope.proceed = function() {
        localStorage.setItem('activeInteractions', JSON.stringify($scope.interactions));
        window.location.href = 'doctor_risk_report.html';
    };

});
</script>

</body>
</html>
